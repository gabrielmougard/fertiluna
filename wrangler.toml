name = "fertiluna"
compatibility_date = "2025-05-20"
compatibility_flags = ["nodejs_compat"]

# Astro's Cloudflare adapter emits the worker + static assets into ./dist.
main = "./dist/_worker.js/index.js"

[observability]
enabled = true
head_sampling_rate = 1.0

# Production custom domains. FR root + EN alias both point at THIS worker.
# Uncomment once BOTH zones are added to your Cloudflare account (otherwise
# `wrangler deploy` errors trying to provision a domain it can't see). When
# enabled, wrangler creates the DNS records + TLS certs for you — no manual DNS.
# Until then the worker is reachable at <name>.<subdomain>.workers.dev.
# routes = [
#   { pattern = "fertiluna.com", custom_domain = true },
# ]

[assets]
directory = "./dist"
binding = "ASSETS"

# --------------------------------------------------
# Environment variables
#
# FertiLuna stores NO user data. The only vars here are for the (future) ad
# integration — left empty by default so the site runs ad-free in dev.
#
# For local dev, create a `.dev.vars` file:
#   DEV_MODE=true
#   ADSENSE_PUB_ID=ca-pub-XXXXXXXXXXXXXXXX
#   ADSENSE_SLOT_INLINE=1234567890
#
# For production, set secrets:
#   wrangler secret put ADSENSE_PUB_ID
# --------------------------------------------------

[vars]
DEV_MODE = "false"
ADSENSE_PUB_ID = "ca-pub-9235945931152642"
ADSENSE_SLOT_TOP = ""
ADSENSE_SLOT_INLINE = ""
ADSENSE_SLOT_RAIL = ""
ADSENSE_SLOT_BOTTOM = ""
ADS_TXT = "google.com, pub-9235945931152642, DIRECT, f08c47fec0942fa0"
