<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1779.1667px" preserveAspectRatio="none" style="width:1379px;height:1779px;background:#FFFFFF;" version="1.1" viewBox="0 0 1379 1779" width="1379.1667px" zoomAndPan="magnify"><title>Cycle classifier --- training and export pipeline</title><defs/><g><g class="title" data-source-line="12"><text fill="#000000" font-family="Helvetica" font-size="29.1667" font-weight="bold" lengthAdjust="spacing" textLength="640.1998" x="366.7099" y="64.1256">Cycle classifier --- training and export pipeline</text></g><ellipse cx="689.9348" cy="114.5833" fill="#222222" rx="20.8333" ry="20.8333" style="stroke:#222222;stroke-width:2.0833;"/><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="443.9738" x="467.9479" y="177.0833"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="402.3071" x="488.7812" y="217.1672">Generate N=50,000 synthetic cycles</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="308.4961" x="488.7812" y="242.1672">(5 physiological archetypes,</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="371.106" x="488.7812" y="267.1672">weights 0.45/0.15/0.15/0.15/0.10)</text><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="511.2956" x="434.287" y="335.4167"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="322.3633" x="455.1203" y="375.5005">Extract 30 NaN-safe features</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="469.6289" x="455.1203" y="400.5005">(SENSIPLAN 3-over-6 rule, follicular/luteal</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="432.1045" x="455.1203" y="425.5005">stats, thermal rise, LH peaks, slopes...)</text><rect fill="#ECEFF1" height="91.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="191.7277" x="594.0709" y="493.75"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="150.061" x="614.9043" y="533.8338">Stratified split</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="97.2778" x="614.9043" y="558.8338">test 20%</text><line style="stroke:#37474F;stroke-width:3.125;" x1="229.5715" x2="1141.5639" y1="627.0833" y2="627.0833"/><rect fill="#ECEFF1" height="91.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="355.6559" x="51.7436" y="668.75"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="313.9893" x="72.5769" y="708.8338">Fit / Calib split (20% of train)</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="261.9019" x="72.5769" y="733.8338">fit set -&gt; RandomForest</text><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="353.007" x="53.068" y="833.3333"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="268.1396" x="73.9014" y="873.4172">RandomForestClassifier</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="311.3403" x="73.9014" y="898.4172">120 trees, depth 12, leaf 12,</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="254.3213" x="73.9014" y="923.4172">sqrt features, balanced</text><path d="M477.8931,1022.9167 L477.8931,1079.1667 L436.2264,1087.5 L477.8931,1095.8333 L477.8931,1152.0833 A0,0 0 0 0 477.8931,1152.0833 L867.8416,1152.0833 A0,0 0 0 0 867.8416,1152.0833 L867.8416,1043.75 L847.0083,1022.9167 L477.8931,1022.9167 A0,0 0 0 0 477.8931,1022.9167" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:1.0417;"/><path d="M847.0083,1022.9167 L847.0083,1043.75 L867.8416,1043.75 L847.0083,1022.9167" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:1.0417;"/><text fill="#000000" font-family="Helvetica" font-size="27.0833" lengthAdjust="spacing" textLength="284.494" x="490.3931" y="1054.188">ONE prefit forest, not 5.</text><text fill="#000000" font-family="Helvetica" font-size="27.0833" lengthAdjust="spacing" textLength="346.1985" x="490.3931" y="1081.2714">~5.6 MB ONNX vs ~250 MB.</text><text fill="#000000" font-family="Helvetica" font-size="27.0833" lengthAdjust="spacing" textLength="263.4674" x="490.3931" y="1108.3547">Makes 0.6 confidence</text><text fill="#000000" font-family="Helvetica" font-size="27.0833" lengthAdjust="spacing" textLength="287.5356" x="490.3931" y="1135.438">gate statistically honest.</text><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="413.3097" x="22.9167" y="1029.1667"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="251.4771" x="43.75" y="1069.2505">CalibratedClassifierCV</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="371.6431" x="43.75" y="1094.2505">FrozenEstimator + sigmoid (Platt)</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="223.7549" x="43.75" y="1119.2505">on held-out calib set</text><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="430.778" x="926.1749" y="769.7917"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="163.9648" x="947.0083" y="809.8755">IsolationForest</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="389.1113" x="947.0083" y="834.8755">150 estimators, contamination 0.10</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="316.8091" x="947.0083" y="859.8755">(out-of-distribution backstop)</text><rect fill="#ECEFF1" height="91.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="295.9757" x="993.576" y="959.375"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="254.3091" x="1014.4094" y="999.4588">Store decision-function</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="252.9663" x="1014.4094" y="1024.4588">percentiles p5/p50/p95</text><line style="stroke:#37474F;stroke-width:3.125;" x1="229.5715" x2="1141.5639" y1="1193.75" y2="1193.75"/><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="468.2292" x="455.8202" y="1235.4167"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="175.0977" x="476.6535" y="1275.5005">skl2onnx export</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="322.4121" x="476.6535" y="1300.5005">target opset 17 / ai.onnx.ml 3</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="426.5625" x="476.6535" y="1325.5005">zipmap false, unwrap FrozenEstimator</text><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="456.2174" x="461.8261" y="1393.75"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="136.1572" x="482.6594" y="1433.8338">Parity check</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="414.5508" x="482.6594" y="1458.8338">classifier max|sklearn - onnx| &lt;= 1e-3</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="209.1553" x="482.6594" y="1483.8338">(achieved ~1.2e-7)</text><rect fill="#ECEFF1" height="116.6667" rx="26.0417" ry="26.0417" style="stroke:#455A64;stroke-width:1.0417;" width="375.2116" x="502.329" y="1552.0833"/><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="159.7534" x="523.1623" y="1592.1672">Write manifest</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="298.7671" x="523.1623" y="1617.1672">labels, feature means/stds,</text><text fill="#000000" font-family="Helvetica" font-size="25" lengthAdjust="spacing" textLength="333.5449" x="523.1623" y="1642.1672">threshold, percentiles, sha256</text><ellipse cx="689.9348" cy="1733.3333" fill="none" rx="22.9167" ry="22.9167" style="stroke:#222222;stroke-width:2.0833;"/><ellipse cx="689.9348" cy="1733.3333" fill="#222222" rx="12.5" ry="12.5" style="stroke:#222222;stroke-width:2.0833;"/><line style="stroke:#37474F;stroke-width:2.0833;" x1="689.9348" x2="689.9348" y1="135.4167" y2="177.0833"/><polygon fill="#37474F" points="681.6015,156.25,689.9348,177.0833,698.2681,156.25,689.9348,164.5833" style="stroke:#37474F;stroke-width:2.0833;"/><line style="stroke:#37474F;stroke-width:2.0833;" x1="689.9348" x2="689.9348" y1="293.75" y2="335.4167"/><polygon fill="#37474F" points="681.6015,314.5833,689.9348,335.4167,698.2681,314.5833,689.9348,322.9167" style="stroke:#37474F;stroke-width:2.0833;"/><line style="stroke:#37474F;stroke-width:2.0833;" x1="689.9348" x2="689.9348" y1="452.0833" y2="493.75"/><polygon fill="#37474F" points="681.6015,472.9167,689.9348,493.75,698.2681,472.9167,689.9348,481.25" style="stroke:#37474F;stroke-width:2.0833;"/><line style="stroke:#37474F;stroke-width:2.0833;" x1="229.5715" x2="229.5715" y1="760.4167" y2="833.3333"/><polygon fill="#37474F" points="221.2382,812.5,229.5715,833.3333,237.9049,812.5,229.5715,820.8333" style="stroke:#37474F;stroke-width:2.0833;"/><line style="stroke:#37474