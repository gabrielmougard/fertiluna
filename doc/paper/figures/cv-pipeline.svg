to [1200,2400] work band</text></g><!--entity SEG--><g class="entity" data-entity="SEG" data-source-line="18" data-uid="ent0004" id="entity_SEG"><rect fill="#ECEFF1" height="158.3333" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="422.642" x="70.8958" y="566.6667"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="286.9812" x="91.7292" y="609.9589">2. color_segmentation</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="340.4297" x="91.7292" y="639.1256">HSV inRange: blue (BBT),</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="380.9753" x="91.7292" y="668.2922">orange (Ratio), purple (Level)</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="282.9081" x="91.7292" y="697.4589">+ morphological close</text></g><!--entity PLOT--><g class="entity" data-entity="PLOT" data-source-line="19" data-uid="ent0005" id="entity_PLOT"><rect fill="#ECEFF1" height="129.1667" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="386.1552" x="89.125" y="850"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="176.7517" x="109.9583" y="893.2922">3. plot_region</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="312.9293" x="109.9583" y="922.4589">ink bbox U gridline band</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="344.4885" x="109.9583" y="951.6256">-&gt; PlotRegion(x0,y0,x1,y1)</text></g><!--entity AX--><g class="entity" data-entity="AX" data-source-line="20" data-uid="ent0006" id="entity_AX"><rect fill="#FFF3E0" height="158.3333" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="535.2498" x="14.5833" y="1104.1667"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="392.2831" x="35.4167" y="1147.4589">4. axis_columns (PaddleOCR)</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="493.5832" x="35.4167" y="1176.6256">margin word-boxes -&gt; column clusters</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="465.9973" x="35.4167" y="1205.7922">OCR -&gt; RANSAC line fit per column</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="380.9753" x="35.4167" y="1234.9589">classify ratio/level/bbt_f/bbt_c</text></g><!--entity DAY--><g class="entity" data-entity="DAY" data-source-line="21" data-uid="ent0007" id="entity_DAY"><rect fill="#ECEFF1" height="158.3333" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="449.4303" x="57.5" y="1387.5"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="147.5423" x="78.3333" y="1430.7922">5. day_axis</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="407.7637" x="78.3333" y="1459.9589">autocorrelation pitch + date row</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="361.4502" x="78.3333" y="1489.1256">+ gridlines -&gt; DayGrid(cells)</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="316.9596" x="78.3333" y="1518.2922">N_DAYS=35 left-packed</text></g><!--entity MARK--><g class="entity" data-entity="MARK" data-source-line="22" data-uid="ent0008" id="entity_MARK"><rect fill="#E8F5E9" height="158.3333" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="505.2999" x="29.5625" y="1670.8333"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="257.7718" x="50.3958" 