<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1052.0833px" preserveAspectRatio="none" style="width:1541px;height:1052px;background:#FFFFFF;" version="1.1" viewBox="0 0 1541 1052" width="1541.6667px" zoomAndPan="magnify"><title>Screenshot import --- hybrid on-device digitization</title><defs/><g><g class="title" data-source-line="12"><text fill="#000000" font-family="Helvetica" font-size="29.1667" font-weight="bold" lengthAdjust="spacing" textLength="698.4192" x="407.2039" y="43.2922">Screenshot import --- hybrid on-device digitization</text></g><!--entity IMG--><g class="entity" data-entity="IMG" data-source-line="14" data-uid="ent0002" id="entity_IMG"><rect fill="#E3F2FD" height="100" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="445.3288" x="581.1667" y="87.5"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="403.6621" x="602" y="130.7922">Screenshot of fertility-app chart</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="186.379" x="602" y="159.9589">(e.g. Premom)</text></g><!--entity A--><g class="entity" data-entity="A" data-source-line="16" data-uid="ent0003" id="entity_A"><rect fill="#E8F5E9" height="129.1667" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="486.5723" x="29.2917" y="329.1667"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="431.1483" x="50.125" y="372.4589">Route A (default) --- Classical CV</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="283.6914" x="50.125" y="401.6256">pure-TS OpenCV port</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="444.9056" x="50.125" y="430.7922">+ PaddleOCR PP-OCRv3 (ONNX)</text></g><!--entity B--><g class="entity" data-entity="B" data-source-line="17" data-uid="ent0004" id="entity_B"><rect fill="#F3E5F5" height="129.1667" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="429.1077" x="589.2708" y="329.1667"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="387.441" x="610.1042" y="372.4589">Route B --- Manual calibration</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="273.9502" x="610.1042" y="401.6256">column-scan digitizer</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="304.6834" x="610.1042" y="430.7922">(WebPlotDigitizer-style)</text></g><!--entity C--><g class="entity" data-entity="C" data-source-line="18" data-uid="ent0005" id="entity_C"><rect fill="#FFF3E0" height="158.3333" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="438.8062" x="1090.6875" y="314.5833"/><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="374.4385" x="1111.5208" y="357.8756">Route C (baseline) --- Neural</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="231.7668" x="1111.5208" y="387.0422">Chart-Vision CNN</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="397.1395" x="1111.5208" y="416.2089">chart-vision-v2.onnx (16.6 MB)</text><text fill="#102027" font-family="Helvetica" font-size="29.1667" lengthAdjust="spacing" textLength="236.7371" x="1111.5208" y="445.3756">[built, not shipped]</text></g><!--entity SERIES--><g class="entity" data-entity="SERIES" data-source-line="24" data-uid="ent0009" id="entity_SERIES"><rect fill="#ECEFF1" height="129.1667" rx="8.3333" ry="8.3333" style="stroke:#455A64;stroke-width:1.0417;" width="370.7174" x="618.4792" y="683.3333"/><text fill="#102027" font-family="Helvetica