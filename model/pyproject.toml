[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fertiluna-model"
version = "0.1.0"
description = "FertiLuna cycle-analysis model — synthetic data, training, ONNX export."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "skl2onnx>=1.16",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Chart-vision model (screenshot -> per-day values). Heavier deps, separated so
# the cycle classifier can be installed without torch.
#   uv pip install -e ".[vision]"
# For a CUDA GPU, install the CUDA torch wheel instead of the default:
#   uv pip install --upgrade "torch>=2.2" --index-url https://download.pytorch.org/whl/cu121
vision = [
    "torch>=2.2",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "onnxscript>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fertiluna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
